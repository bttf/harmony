# Local production-mode run. The deployed instance runs on Railway (deploy/README.md).
services:
  harmony:
    build:
      context: .
      args:
        HARMONY_REVISION: ${HARMONY_REVISION:?set HARMONY_REVISION in .env}
    image: waxnerd/harmony:${HARMONY_REVISION}
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      - '127.0.0.1:8000:8000'
